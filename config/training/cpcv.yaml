output_dir: outputs/cpcv

data:
  data_path: data/clean              # TradingEnv liest hieraus
  # optional: panel_path: data/raw/ucits_compact/panel.parquet
  # optional: date_start: '2014-01-01'
  # optional: date_end:   '2021-12-31'

cv:
  n_folds: 5
  embargo_days: 5

env:
  cost_bps: 25
  t_plus_one: true

runs:
  - algo: ppo
    total_timesteps: 1500000
    seeds: [42, 1337]
    hyperparams:
      learning_rate: 0.0003
      n_steps: 4096
      batch_size: 512
      gamma: 0.999
      gae_lambda: 0.95
      clip_range: 0.2
      ent_coef: 0.001
      vf_coef: 0.5
      n_epochs: 10

  - algo: sac
    total_timesteps: 2000000
    seeds: [42]
    hyperparams:
      learning_rate: 0.0003
      buffer_size: 1000000
      batch_size: 256
      gamma: 0.999
      tau: 0.005
      train_freq: 1
      gradient_steps: 1
      learning_starts: 10000