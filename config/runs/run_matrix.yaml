# config/run_matrix.yaml
common:
  fees:
    commission_bps: 25
    slippage_bps: 5
    turnover_cap: 0.30
  run:
    total_timesteps: 200000
    run_root: data/accounting/runs

# Was variiert (automatische Kartesische Produkte)
grid:
  strategy:               # mehrere Strategien möglich
    - kind: cpcv
      splits: config/splits_cpcv.yaml
    - kind: walkforward
      splits: config/splits_wf.yaml
  reward:
    - kind: log
    - kind: icvar
      icvar:
        alpha: 0.05
        min_period: 40
        lambda: 1.0
    - kind: icvar_dd
      icvar:
        alpha: 0.05
        min_period: 40
        lambda: 1.0
      dd:
        gamma: 0.0
  algo:
    - name: ppo
      policy: MultiInputPolicy
      policy_kwargs:
        features_extractor_class: CNN1DExtractor
        features_extractor_kwargs:
          channels: 32
          kernel_sizes: [5,5,3]
          strides: [1,1,1]
          hidden_dim: 128
        net_arch: {pi: [256,128], vf: [256,128]}
      ppo_kwargs:
        learning_rate: 0.0003
        n_steps: 4096
        batch_size: 128
        n_epochs: 5
        gamma: 0.999
        gae_lambda: 0.95
        clip_range: 0.2
        max_grad_norm: 0.5
    - name: sac
      policy: MultiInputPolicy
      policy_kwargs:
        features_extractor_class: CNN1DExtractor
        features_extractor_kwargs:
          channels: 32
          kernel_sizes: [5,5,3]
          strides: [1,1,1]
          hidden_dim: 128
      sac_kwargs:
        learning_rate: 0.0003
        buffer_size: 1000000
        batch_size: 256
        tau: 0.005
        gamma: 0.99
        train_freq: 1
        gradient_steps: 1
        learning_starts: 10000
        target_update_interval: 1
  state_spec:
    - config/state_config/state0.yml
    - config/state_config/state1.yml
  seed: [42]               # hier kannst du später mehrere Seeds eintragen

# Optional: gezielte Kombinationen (statt vollem Kartesischen Produkt)
# Wenn vorhanden, ignoriert der Runner "grid" und nutzt nur diese Liste.
matrix:
  enabled: false
  runs:
    - strategy: {kind: cpcv, splits: config/splits_cpcv.yaml}
      reward:   {kind: log}
      algo:     {name: ppo}
      state_spec: config/state_config/state0.yml
      features_source: features_v1_raw_z
      seed: 7
      overrides:
        run: {total_timesteps: 300000}   # per-Run Override möglich